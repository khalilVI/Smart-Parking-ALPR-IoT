<!DOCTYPE html>
<html>
<head>
    <title>User Management - PFE26</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #0a0a0a; color: white; font-family: -apple-system, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: rgba(25, 25, 25, 0.8); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #333; padding: 15px; text-align: left; }
        th { color: #a0a0a0; }
        .btn { padding: 10px 20px; background: linear-gradient(90deg, #ff5e00 0%, #ff2a00 100%); color: white; border: none; border-radius: 50px; cursor: pointer; text-decoration: none; font-weight: bold;}
        .admin-tag { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Panel - User Management</h2>
        <a href="/" class="btn" style="background: #333;">&larr; Back to Dashboard</a>
        <table>
            <tr><th>ID</th><th>Email</th><th>Role</th><th>Action</th></tr>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.email }}</td>
                <td class="{% if user.role == 'admin' %}admin-tag{% endif %}">{{ user.role | upper }}</td>
                <td>
                    {% if user.id != current_user.id %}
                    <form method="POST" action="/toggle_role/{{ user.id }}" style="margin:0;">
                        <button type="submit" class="btn">
                            {% if user.role == 'admin' %}Demote to User{% else %}Make Admin{% endif %}
                        </button>
                    </form>
                    {% else %}
                    <i style="color: #a0a0a0;">Current User</i>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
