<!DOCTYPE html>
<html>
<head>
    <title>Register - PFE26</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #0a0a0a; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(25, 25, 25, 0.8); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.1); }
        button { width: 100%; padding: 15px; background: linear-gradient(90deg, #ff5e00 0%, #ff2a00 100%); border: none; color: white; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1rem; }
        .error { color: #ff3b30; margin-bottom: 15px; font-weight: bold; }
        a { color: #ff5e00; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Create Account</h2>
        {% if error %} <div class="error">{{ error }}</div> {% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email (e.g. user@gmail.com)" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
        </form>
        <a href="/login">Already have an account? Login</a>
    </div>
</body>
</html>
